spring:
  application:
    name: tinystore-inventory-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_inventory
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/inventory
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}

# ============================================================
# Inventory Feature Flags (RFC-001 Canonical Reservation)
# ============================================================
inventory:
  # Batch-3: Set to false to shut down legacy /api/inventory/stock/* endpoints
  legacy-stock-api-enabled: ${INVENTORY_LEGACY_STOCK_API_ENABLED:true}

  reservation:
    # When true, InventoryDeductAppService routes to canonical InventoryReservationAppService
    canonical-enabled: ${INVENTORY_RESERVATION_CANONICAL_ENABLED:false}

    expiry:
      # Enable/disable the reservation expiry scheduler
      enabled: ${INVENTORY_RESERVATION_EXPIRY_ENABLED:true}
      # Spring Duration format
      fixed-delay: ${INVENTORY_RESERVATION_EXPIRY_FIXED_DELAY:PT1M}
      # Default reservation TTL in minutes (used when caller does not supply expireAt)
      default-minutes: ${INVENTORY_RESERVATION_EXPIRY_DEFAULT_MINUTES:30}
    permit-all:
      enabled: ${TINYSTORE_SECURITY_PERMIT_ALL_ENABLED:false}
  kafka:
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
      dlt:
        enabled: true
        suffix: .DLT
server:
  port: 13000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always