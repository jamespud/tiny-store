spring:
  application:
    name: tinystore-inventory-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_inventory
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/inventory
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}
  kafka:
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
      dlt:
        enabled: true
        suffix: .DLT

# ============================================================
# Inventory Configuration
# ============================================================
inventory:
  kafka:
    topic:
      general: tinystore.inventory.general
  uncommit:
    # 未提交预扣的回收超时（兜底：预扣已记账但对应订单/预约从未建立）。
    # 配置不变量：必须 > 订单侧最大合法预约 TTL，否则会提前释放仍然合法的预约。
    timeout: ${INVENTORY_UNCOMMIT_TIMEOUT:PT30M}
    # 孤儿定向回收阈值（C12 safety net）：member 年龄超过该值且 DB 中不存在对应
    # reservation_id 的，才判定为孤儿并释放。
    # 配置不变量：必须 > Kafka 短暂中断时 outbox INVENTORY_RESERVE_DB 的最坏异步建库延迟
    # （chaos SLA 5 分钟），否则合法预约会被误判释放；且应 < timeout 才有加速意义。
    orphan-check-delay: ${INVENTORY_UNCOMMIT_ORPHAN_CHECK_DELAY:PT10M}
  reservation:
    expiry:
      # Enable/disable the reservation expiry scheduler
      enabled: ${INVENTORY_RESERVATION_EXPIRY_ENABLED:true}
      # Spring Duration format
      fixed-delay: ${INVENTORY_RESERVATION_EXPIRY_FIXED_DELAY:PT1M}
      # Default reservation TTL in minutes (used when caller does not supply expireAt)
      default-minutes: ${INVENTORY_RESERVATION_EXPIRY_DEFAULT_MINUTES:15}
    permit-all:
      enabled: ${TINYSTORE_SECURITY_PERMIT_ALL_ENABLED:false}

  reconciliation:
    # Enable/disable the periodic reconcile job
    enabled: ${INVENTORY_RECONCILIATION_ENABLED:true}
    # Spring Duration format; default 10 minutes
    fixed-delay: ${INVENTORY_RECONCILIATION_FIXED_DELAY:PT10M}
server:
  port: 13000

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    # D1: Boot 3.5 has no per-backend zipkin switch -- the sender and span handler are gated on
    # management.tracing.enabled (checked via /actuator/beans), so an empty ZIPKIN_ENDPOINT used to
    # build a reporter aimed at an empty URI that dropped every span without a word. Tracing is
    # therefore opt-in: ZIPKIN_ENABLED=true + ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans.
    enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Spring Boot's @ConditionalOnEnabledMetricsExport for prometheus reads
  # management.<backend>.metrics.export.enabled (backend before "metrics.export").
  # Explicit enable so the PrometheusMeterRegistry + /actuator/prometheus are created.
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      # A4: 让 /actuator/health/readiness 在 compose/k8s 下都存在（非 k8s 环境 Boot 默认不建 probe 组）。
      probes:
        enabled: true
