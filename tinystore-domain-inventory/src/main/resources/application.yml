spring:
  application:
    name: tinystore-inventory-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_inventory
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/inventory
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 10
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}
  kafka:
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
      dlt:
        enabled: true
        suffix: .DLT

# ============================================================
# Inventory Configuration
# ============================================================
inventory:
  kafka:
    topic:
      general: tinystore.inventory.general
  reservation:
    expiry:
      # Enable/disable the reservation expiry scheduler
      enabled: ${INVENTORY_RESERVATION_EXPIRY_ENABLED:true}
      # Spring Duration format
      fixed-delay: ${INVENTORY_RESERVATION_EXPIRY_FIXED_DELAY:PT1M}
      # Default reservation TTL in minutes (used when caller does not supply expireAt)
      default-minutes: ${INVENTORY_RESERVATION_EXPIRY_DEFAULT_MINUTES:15}
    permit-all:
      enabled: ${TINYSTORE_SECURITY_PERMIT_ALL_ENABLED:false}

  reconciliation:
    # Enable/disable the periodic reconcile job
    enabled: ${INVENTORY_RECONCILIATION_ENABLED:true}
    # Spring Duration format; default 10 minutes
    fixed-delay: ${INVENTORY_RECONCILIATION_FIXED_DELAY:PT10M}
server:
  port: 13000

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # Spring Boot's @ConditionalOnEnabledMetricsExport for prometheus reads
  # management.<backend>.metrics.export.enabled (backend before "metrics.export").
  # Explicit enable so the PrometheusMeterRegistry + /actuator/prometheus are created.
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
