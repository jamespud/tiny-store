spring:
  # Test profile - use Testcontainers
  profiles:
    active: test
    
  # Testcontainers will provide actual PostgreSQL
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway migrations in tests
      
  # Testcontainers Redis
  data:
    redis:
      host: ${REDIS_TEST_HOST:localhost}
      port: ${REDIS_TEST_PORT:6379}

# Feature toggles for testing
tinystore:
  security:
    permit-all:
      enabled: true  # Bypass authentication in tests
    resource-server:
      enabled: false  # Disable OAuth2 resource server in tests
  feature:
    outbox:
      enabled: true  # Test outbox functionality
      
logging:
  level:
    com.github.spud.tinystore: DEBUG
    org.testcontainers: INFO
