spring:
  application:
    name: product-service-test
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  flyway:
    enabled: true
    locations: classpath:db/migration/product
    baseline-on-migrate: true

  # 禁用 OAuth2 资源服务器（测试环境不需要）
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

# 禁用功能开关
tinystore:
  security:
    resource-server:
      enabled: false
  feature:
    outbox:
      enabled: false
