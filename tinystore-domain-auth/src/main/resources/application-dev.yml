server:
  port: 9000
spring:
  application:
    name: tinystore-auth
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore?currentSchema=tinystore_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
  cache:
    type: redis
  cloud:
    stream:
      bindings:
        userCreated-in-0:
          destination: user-created
          content-type: application/json
        userUpdated-in-0:
          destination: user-updated
          content-type: application/json
        userStatusChanged-in-0:
          destination: user-status-changed
          content-type: application/json
        userCredentialChanged-in-0:
          destination: user-credential-changed
          content-type: application/json
      rabbit:
        bindings:
          userCreated-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
          userUpdated-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
          userStatusChanged-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
          userCredentialChanged-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
  authorization-server:
    issuer: https://auth.dev.tinystore.com
  security:
    oauth2:
      client:
        registration:
          login-client:
            provider: spring
            client-id: login-client
            client-secret: openid-connect
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/login-client
            scope: openid,profile
            client-name: Spring
        provider:
          spring:
            authorization-uri: http://localhost:9000/oauth2/authorize
            token-uri: http://localhost:9000/oauth2/token
            jwk-set-uri: http://localhost:9000/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# dev defaults; use per-profile overrides below
tinystore:
  internal:
    call-token: ${TINYSTORE_INTERNAL_CALL_TOKEN:changeit}
  auth:
    keystore:
      location: classpath:keystore/tinystore-auth.jks
      password: tinystore
    key:
      alias: jwt
      password: tinystore
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080,https://*.dev.tinystore.com"
    tokens:
      user:
        access-token-ttl: PT2H
        id-token-ttl: PT2H
        refresh-token-ttl: P30D
      m2m:
        access-token-ttl: PT5M
    otp:
      ttl: PT5M
      max-send-per-window: 2
      rate-window: PT1M
      block-duration: PT5M
      request-lock-ttl: PT3S
      request-cache-ttl: PT10M
    outbox:
      enabled: true
      publish-interval: PT5S
      batch-size: 100
    dynamic-registration:
      enabled: true
      require-token: true

# Eureka配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

---
spring:
  config:
    activate:
      on-profile: test
  authorization-server:
    issuer: https://auth.test.tinystore.com

---
spring:
  config:
    activate:
      on-profile: prod
  authorization-server:
    issuer: https://auth.tinystore.com
