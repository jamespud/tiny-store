<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>授权同意 - TinyStore Auth</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft Yahei", sans-serif; background:#f6f7f9; padding:40px; }
    .card { max-width:480px; margin:40px auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 6px 20px rgba(0,0,0,0.08);} 
    .title { font-size:20px; margin-bottom:16px; }
    ul { padding-left: 1.2em; }
    button { margin-right:8px; padding:10px 12px; background:#276ef1; color:#fff; border:0; border-radius:8px; cursor:pointer; }
    .cancel { background:#999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">请求授权</div>
    <p>应用 <strong th:text="${clientId}"></strong> 请求访问以下权限：</p>
    <form method="post" action="/oauth2/authorize">
      <input type="hidden" name="client_id" th:value="${clientId}" />
      <input type="hidden" name="state" th:value="${state}" />
      <ul>
        <li th:each="s : ${scopesToApprove}">
          <label>
            <input type="checkbox" name="scope" th:value="${s}" checked="checked" />
            <span th:text="${s}"></span>
          </label>
        </li>
      </ul>
      <div th:each="ps : ${previouslyApprovedScopes}">
        <input type="hidden" name="scope" th:value="${ps}" />
      </div>
      <button type="submit" name="user_consent" value="true">同意</button>
      <a class="cancel" href="/">取消</a>
    </form>
  </div>
</body>
</html>
