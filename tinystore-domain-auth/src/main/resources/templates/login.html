<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - TinyStore Auth</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft Yahei", sans-serif; background:#f6f7f9; padding:40px; }
    .card { max-width:360px; margin:40px auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 6px 20px rgba(0,0,0,0.08);} 
    .title { font-size:20px; margin-bottom:16px; }
    label { display:block; font-size:12px; color:#555; margin:12px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid #dce0e6; border-radius:8px; font-size:14px; }
    button { width:100%; margin-top:16px; padding:10px 12px; background:#276ef1; color:#fff; border:0; border-radius:8px; cursor:pointer; }
    .hint { font-size:12px; color:#666; margin-top:12px; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">登录 TinyStore</div>
    <form method="post" action="/login">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <button type="submit">登录</button>
      <div class="hint">开发账号：user / admin；密码：changeit</div>
    </form>
  </div>
</body>
</html>
