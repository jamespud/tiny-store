server:
  port: 9000

spring:
  application:
    name: tinystore-auth
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  authorization-server:
    issuer: https://auth.dev.tinystore.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# dev defaults; use per-profile overrides below
 tinystore:
  auth:
    keystore:
      location: classpath:keystore/tinystore-auth.jks
      password: changeit
    key:
      alias: auth
      password: changeit
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080,https://*.dev.tinystore.com"
    tokens:
      user:
        access-token-ttl: PT2H
        id-token-ttl: PT2H
        refresh-token-ttl: P30D
      m2m:
        access-token-ttl: PT5M
    otp:
      ttl: PT5M

---
spring:
  config:
    activate:
      on-profile: test
  authorization-server:
    issuer: https://auth.test.tinystore.com

---
spring:
  config:
    activate:
      on-profile: prod
  authorization-server:
    issuer: https://auth.tinystore.com
