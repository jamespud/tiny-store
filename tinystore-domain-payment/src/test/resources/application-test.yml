spring:
  application:
    name: pay-service-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: tinystore_payment
        hbm2ddl.create_namespaces: true
  flyway:
    enabled: true
    locations: classpath:db/migration/payment
    default-schema: tinystore_payment

payment:
  kafka:
    topic:
      order-events: tinystore.order.general
