spring:
  application:
    name: pay-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_payment
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/payment
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: pay-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 消费者方法声明了 Acknowledgment 参数，容器必须是 MANUAL 才能注入它。
      # 缺失该配置 = 每条消息在参数绑定阶段就抛异常（C1）。
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}

payment:
  kafka:
    topic:
      order-events: tinystore.order.general
    consumer:
      retry:
        # 有界重试：1s × 5 次，超过后进 <topic>.DLT
        max-attempts: ${PAYMENT_KAFKA_RETRY_MAX_ATTEMPTS:5}
        backoff:
          interval-ms: ${PAYMENT_KAFKA_RETRY_INTERVAL_MS:1000}
  scheduler:
    notification-retry-interval: 120000
    notification-retry-batch-size: 50

wechat:
  pay:
    # 微信支付 v3 回调验签/解密所需（生产从密钥管理注入，切勿硬编码）
    # api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    # platform-cert-pem: ${WECHAT_PAY_PLATFORM_CERT_PEM:}
    channel:
      type: ${WECHAT_PAY_CHANNEL_TYPE:mock}

server:
  port: 8083

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    # D1: Boot 3.5 has no per-backend zipkin switch -- the sender and span handler are gated on
    # management.tracing.enabled (checked via /actuator/beans), so an empty ZIPKIN_ENDPOINT used to
    # build a reporter aimed at an empty URI that dropped every span without a word. Tracing is
    # therefore opt-in: ZIPKIN_ENABLED=true + ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans.
    enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      # A4: 让 /actuator/health/readiness 在 compose/k8s 下都存在（非 k8s 环境 Boot 默认不建 probe 组）。
      probes:
        enabled: true
