spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore?currentSchema=tinystore_order
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration/order
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:order-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

feign:
  okhttp:
    enabled: true
  httpclient:
    enabled: false

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}
  order:
    admin:
      token: ${ADMIN_TOKEN:change-me-in-production}

order:
  idempotency:
    ttl-seconds: 600
    # Redis 故障处理策略：
    # - true（默认）：Redis 不可用时抛出异常返回 503，保证幂等语义严格性
    # - false（降级模式）：Redis 不可用时跳过幂等检查，允许请求通过（有重复风险，仅用于紧急情况）
    fail-on-redis-error: true
  payment-timeout-seconds: 900
  auto-receive-timeout-seconds: 604800
  kafka:
    topic:
      general: tinystore.order.general
  outbox:
    poll-interval: 5000
    batch-size: 1000

  # ============================================================
  # Inventory Integration Feature Flags (RFC-001 Canonical Reservation)
  # ============================================================
  inventory:
    # When true, use canonical /api/inventory/reservations/* endpoints instead of legacy /api/inventory/deduct
    use-canonical-reservation-api: ${ORDER_INVENTORY_USE_CANONICAL_RESERVATION_API:false}
    cleanup:
      enabled: true
      cron: "0 0 3 * * ?"
      retention-days: 7
  scheduler:
    payment-timeout-interval: 60000

server:
  port: 28080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always