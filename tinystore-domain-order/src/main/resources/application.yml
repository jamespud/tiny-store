spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_order
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration/order
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      properties:
        # 快速失败：broker 不可用时 send() 不再阻塞默认 60s，避免整个 outbox 轮询线程被拖住（C12）。
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
        # 明确的投递上限：超过即视为传输失败，交给退避重试而不是无限挂起。
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:order-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:9000}

feign:
  okhttp:
    enabled: true
  httpclient:
    enabled: false

tinystore:
  security:
    resource-server:
      enabled: ${TINYSTORE_SECURITY_RESOURCESERVER_ENABLED:false}
  order:
    admin:
      token: ${ADMIN_TOKEN:change-me-in-production}

order:
  idempotency:
    ttl-seconds: 600
    # Redis 故障处理策略：
    # - true（默认）：Redis 不可用时抛出异常返回 503，保证幂等语义严格性
    # - false（降级模式）：Redis 不可用时跳过幂等检查，允许请求通过（有重复风险，仅用于紧急情况）
    fail-on-redis-error: true
  payment-timeout-seconds: 900
  auto-receive-timeout-seconds: 604800
  kafka:
    topic:
      general: tinystore.order.general
      promotion-events: tinystore.promotion.general
      inventory-events: tinystore.inventory.general
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
  reservation:
    ttl-minutes: 15
  promotion:
    commit-async-enabled: false
    pending-timeout-check-ms: 10000
    pending-timeout-batch-size: 200
    pending-timeout-seconds: 30
  outbox:
    poll-interval: 5000
    batch-size: 1000
    publisher-pool-size: 2
    cleanup:
      enabled: true
      retention-days: 7
      cron: "0 0 3 * * ?"

  # ============================================================
  # Inventory Integration Feature Flags (RFC-001 Canonical Reservation)
  # ============================================================
  inventory:
    # When true, use canonical /api/inventory/reservations/* endpoints instead of legacy /api/inventory/deduct
    use-canonical-reservation-api: ${ORDER_INVENTORY_USE_CANONICAL_RESERVATION_API:false}
    cleanup:
      enabled: true
      cron: "0 0 3 * * ?"
      retention-days: 7
  scheduler:
    payment-timeout-interval: 60000
    auto-receive-interval: 3600000

server:
  port: 28080

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    # D1: Boot 3.5 has no per-backend zipkin switch -- the sender and span handler are gated on
    # management.tracing.enabled (checked via /actuator/beans), so an empty ZIPKIN_ENDPOINT used to
    # build a reporter aimed at an empty URI that dropped every span without a word. Tracing is
    # therefore opt-in: ZIPKIN_ENABLED=true + ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans.
    enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      # A4: 让 /actuator/health/readiness 在 compose/k8s 下都存在（非 k8s 环境 Boot 默认不建 probe 组），
      # compose healthcheck 与多实例门禁据此判断"能接流量"，而不只是"JVM 还活着"。
      probes:
        enabled: true
