spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore?currentSchema=tinystore_order
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

tinystore:
  security:
    resource-server:
      enabled: true
server:
  servlet:
    context-path: /order/v1

order:
  digest:
    secret: ${ORDER_DIGEST_SECRET:default-digest-secret-key-change-in-production}
  preorder:
    ttl-seconds: 900  # 15 minutes
  idempotency:
    ttl-seconds: 600  # 10 minutes
  cancel:
    paymentVoidWindowMillis: 120000  # 2 minutes
