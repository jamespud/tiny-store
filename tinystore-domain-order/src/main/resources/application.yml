spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore?currentSchema=tinystore_order
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

tinystore:
  security:
    resource-server:
      enabled: true

order:
  idempotency:
    ttl-seconds: 600
  payment-timeout-seconds: 900
  auto-receive-timeout-seconds: 604800
  kafka:
    topic:
      general: tinystore.order.general
  outbox:
    poll-interval: 5000
    batch-size: 100
  scheduler:
    payment-timeout-interval: 60000
  feign:
    promotion-url: http://localhost:8092/promotions
    inventory-url: http://localhost:8093/inventory

server:
  port: 28080