spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_order
    username: postgres
    password: postgres
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  data:
    redis:
      host: localhost
      port: 6379

order:
  idempotency:
    ttl-seconds: 600
  payment:
    timeout-seconds: 120
  auto-receive:
    timeout-seconds: 60
