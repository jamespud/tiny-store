services:
  redis-1:
    image: redis:7.4
    ports:
      - "6379:6379"
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-1
      --cluster-announce-port 6379
    volumes:
      - redis-1:/data
    networks: [redis-cluster]

  redis-2:
    image: redis:7.4
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-2
      --cluster-announce-port 6379
    volumes:
      - redis-2:/data
    networks: [redis-cluster]

  redis-3:
    image: redis:7.4
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-3
      --cluster-announce-port 6379
    volumes:
      - redis-3:/data
    networks: [redis-cluster]

  redis-4:
    image: redis:7.4
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-4
      --cluster-announce-port 6379
    volumes:
      - redis-4:/data
    networks: [redis-cluster]

  redis-5:
    image: redis:7.4
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-5
      --cluster-announce-port 6379
    volumes:
      - redis-5:/data
    networks: [redis-cluster]

  redis-6:
    image: redis:7.4
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --cluster-announce-ip redis-6
      --cluster-announce-port 6379
    volumes:
      - redis-6:/data
    networks: [redis-cluster]

  cluster-init:
    image: redis:7.4
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    entrypoint: >
      sh -c "
      sleep 5 &&
      redis-cli --cluster create
      redis-1:6379 redis-2:6379 redis-3:6379
      redis-4:6379 redis-5:6379 redis-6:6379
      --cluster-replicas 1
      --cluster-yes
      "
    networks: [redis-cluster]

networks:
  redis-cluster:

volumes:
  redis-1:
  redis-2:
  redis-3:
  redis-4:
  redis-5:
  redis-6: