services:
  postgres:
    image: postgres:18.1
    container_name: tinystore-postgres
    environment:
      POSTGRES_DB: tinystore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tinystore -h localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [ tinystore-net ]

  redis:
    image: redis:7.4.0
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [ tinystore-net ]


  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s
    networks: [ tinystore-net ]


  nacos:
    image: nacos/nacos-server:v3.1.1
    ports:
      - "18080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: "ZXlKaGJHY2lPaUpJVXpVeE1pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnVZVzFsSWpvaVNtOW9iaUlzSW1Ga2JXbHVJanAwY25WbGZRLklpdUxkRHdTX0VONmU1ZENzdmlRRFVsZ0djUXdkWHdadm5vM284NjNZMlFmRGphYnNYZ2gyQURqYnBzVVU2VUF1R1FSVFFmb0ZhajdSV3owdFRHSTh3"
      NACOS_AUTH_IDENTITY_KEY: "nacos-key"
      NACOS_AUTH_IDENTITY_VALUE: "nacos-val"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/instance/list?serviceName=nacos" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [ tinystore-net ]


networks:
  tinystore-net:
    driver: bridge