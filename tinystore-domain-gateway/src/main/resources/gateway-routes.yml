routes:
  # Health check routes (high priority, static URI to management ports)
  - id: order-health
    uri: http://order:28080
    predicates:
      - Path=/internal/health/order
    filters:
      - SetPath=/actuator/health
  - id: promotion-health
    uri: http://promotion:1200
    predicates:
      - Path=/internal/health/promotion
    filters:
      - SetPath=/actuator/health
  - id: inventory-health
    uri: http://inventory:13000
    predicates:
      - Path=/internal/health/inventory
    filters:
      - SetPath=/actuator/health
  - id: product-health
    uri: http://product:8090
    predicates:
      - Path=/internal/health/product
    filters:
      - SetPath=/actuator/health
  - id: auth-health
    uri: http://auth:9000
    predicates:
      - Path=/internal/health/auth
    filters:
      - SetPath=/actuator/health
  - id: account-health
    uri: http://account:8000
    predicates:
      - Path=/internal/health/account
    filters:
      - SetPath=/actuator/health
  - id: pay-health
    uri: http://payment:8083
    predicates:
      - Path=/internal/health/pay
    filters:
      - SetPath=/actuator/health
  # Business routes
  - id: order-service
    uri: lb://order-service
    predicates:
      - Path=/api/order/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
        overrides:
          - path: /api/promotion/seckill/**
            capacity: 5
            refillRate: 5
      idempotency:
        # 下单的业务幂等由订单域单独负责（原子 acquire + 请求指纹 + afterCommit 落库）。
        # 网关再维护一套 PROCESSING/COMPLETED 生命周期会与订单域冲突：
        # 网关把下游 5xx 也标记为 COMPLETED，导致失败后同键重试被 409 拒绝（见 C9）。
        enabled: false
        keyTemplate: "idempotent:tinystore:order:create:{unique}"
  - id: pay-service
    uri: lb://pay-service
    predicates:
      - Path=/api/pay/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 80
        refillRate: 80
      idempotency:
        enabled: false
  - id: promotion-service
    uri: lb://promotion-service
    predicates:
      - Path=/api/promotion/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: true
  - id: product-service
    uri: lb://product-service
    predicates:
      - Path=/api/products/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: false
  - id: inventory-service
    uri: lb://tinystore-inventory-service
    predicates:
      - Path=/api/inventory/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: false
  - id: account-service
    uri: lb://tinystore-domain-account
    predicates:
      - Path=/api/account/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 80
        refillRate: 80
      idempotency:
        enabled: false
  - id: auth-service
    uri: lb://tinystore-auth
    predicates:
      - Path=/api/auth/**,/api/admin/**,/oidc/**
    filters:
      - StripPrefix=0
    policies:
      rateLimit:
        type: ip
        capacity: 50
        refillRate: 50
      idempotency:
        enabled: false
