routes:
  # Health check routes (high priority, static URI to management ports)
  - id: order-health
    uri: http://order:38080
    predicates:
      - Path=/api/order/trades/health-check
    filters:
      - SetPath=/actuator/health
  - id: promotion-health
    uri: http://promotion:11200
    predicates:
      - Path=/api/promotion/health-check
    filters:
      - SetPath=/actuator/health
  - id: inventory-health
    uri: http://inventory:23000
    predicates:
      - Path=/api/inventory/stock/health-check
    filters:
      - SetPath=/actuator/health
  - id: product-health
    uri: http://product:18090
    predicates:
      - Path=/api/products/health-check
    filters:
      - SetPath=/actuator/health
  # Business routes
  - id: order-service
    uri: lb://order-service
    predicates:
      - Path=/api/order/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
        overrides:
          - path: /api/promotion/seckill/**
            capacity: 5
            refillRate: 5
      idempotency:
        enabled: true
        keyTemplate: "idempotent:tinystore:order:create:{unique}"
  - id: pay-service
    uri: lb://pay-service
    predicates:
      - Path=/api/pay/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 80
        refillRate: 80
      idempotency:
        enabled: false
  - id: promotion-service
    uri: lb://promotion-service
    predicates:
      - Path=/api/promotion/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: true
  - id: product-service
    uri: lb://product-service
    predicates:
      - Path=/api/products/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: false
  - id: inventory-service
    uri: lb://tinystore-inventory-service
    predicates:
      - Path=/api/inventory/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 100
        refillRate: 100
      idempotency:
        enabled: false
  - id: account-service
    uri: lb://tinystore-domain-account
    predicates:
      - Path=/api/account/**
    filters:
      - StripPrefix=1
    policies:
      rateLimit:
        type: ip
        capacity: 80
        refillRate: 80
      idempotency:
        enabled: false
  - id: auth-service
    uri: lb://tinystore-auth
    predicates:
      - Path=/api/auth/**,/api/admin/**,/oidc/**
    filters:
      - StripPrefix=0
    policies:
      rateLimit:
        type: ip
        capacity: 50
        refillRate: 50
      idempotency:
        enabled: false

