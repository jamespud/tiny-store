server:
  port: 8080

spring:
  application:
    name: tinystore-gateway
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    gateway:
      metrics:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:https://auth.dev.tinystore.com/.well-known/jwks.json}

gateway:
  dynamic:
    refresh-interval: ${GATEWAY_REFRESH_INTERVAL:PT10S}
    routes-location: ${GATEWAY_ROUTES_LOCATION:classpath:gateway-routes.yml}

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

idempotency:
  ttl: ${IDEMPOTENCY_TTL:PT5M}
  key-prefix: ${IDEMPOTENCY_KEY_PREFIX:idempotent}

security:
  jwks:
    cache-ttl: ${JWKS_CACHE_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway-refresh
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        tinystore.gateway.requests.latency: true
    tags:
      application: ${spring.application.name}

tinystore:
  security:
    resource-server:
      enabled: true
