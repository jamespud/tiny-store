server:
  port: 8080

spring:
  application:
    name: tinystore-gateway
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    loadbalancer:
      # The instance list is cached per client for `spring.cloud.loadbalancer.cache.ttl` (framework
      # default 35s), so a Nacos deregistration can stay invisible to the gateway for that long.
      # 2s bounds one of E1's two windows -- "deregistered, still selected" (the audit saw Nacos drop
      # the ip at 07:21:45 and the gateway still dial it at 07:21:48). The other window, the request
      # already in flight at the kill instant, is what the per-route retry policy covers; this TTL
      # cannot help there.
      cache:
        ttl: ${LOADBALANCER_CACHE_TTL:2s}
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          httpclient:
            # Bounded failover latency: a dead container leaves a veth-less ip behind, so a TCP
            # connect to it is not refused, it black-holes until the connect timeout. Without an
            # explicit value Netty waits ~30s, which is why the pre-fix probe recorded 20s stalls
            # (`--max-time 20` in the probe) instead of a fast failure the retry filter can act on.
            connect-timeout: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT:1000}
            # Upper bound for a downstream response; must stay below the client-side timeouts so the
            # gateway, not the caller, decides the outcome. `response-timeout` is unset by default in
            # the framework (= wait forever).
            response-timeout: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:30s}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

gateway:
  dynamic:
    refresh-interval: ${GATEWAY_REFRESH_INTERVAL:PT10S}
    routes-location: ${GATEWAY_ROUTES_LOCATION:classpath:gateway-routes.yml}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}

idempotency:
  ttl: ${IDEMPOTENCY_TTL:PT5M}
  key-prefix: ${IDEMPOTENCY_KEY_PREFIX:idempotent}

security:
  jwks:
    cache-ttl: ${JWKS_CACHE_TTL:PT5M}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway-refresh
  metrics:
    distribution:
      percentiles-histogram:
        tinystore.gateway.requests.latency: true
    tags:
      application: ${spring.application.name}

tinystore:
  security:
    resource-server:
      # 生产默认开启鉴权（A1）。测试栈通过环境变量 TINYSTORE_SECURITY_RESOURCESERVER_ENABLED=false 显式关闭。
      enabled: true
