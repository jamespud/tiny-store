apiVersion: v1
kind: ConfigMap
metadata:
  name: tinystore-redis-config
  labels:
    app: tinystore-redis
data:
  host: tinystore-redis
  port: "6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinystore-redis
  labels:
    app: tinystore-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinystore-redis
  template:
    metadata:
      labels:
        app: tinystore-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tinystore-redis-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tinystore-redis
  labels:
    app: tinystore-redis
spec:
  selector:
    app: tinystore-redis
  ports:
    - port: 6379
      targetPort: 6379
