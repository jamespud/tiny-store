server:
  port: 8000
spring:
  application:
    name: tinystore-domain-account
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    loadbalancer:
      ribbon:
        enabled: false
    stream:
      bindings:
        userCreated-out-0:
          destination: user-created
          content-type: application/json
        userUpdated-out-0:
          destination: user-updated
          content-type: application/json
        userStatusChanged-out-0:
          destination: user-status-changed
          content-type: application/json
        userCredentialChanged-out-0:
          destination: user-credential-changed
          content-type: application/json
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        access-key:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        access-key:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_account
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/account
# Actuator配置
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    # D1: Boot 3.5 has no per-backend zipkin switch -- the sender and span handler are gated on
    # management.tracing.enabled (checked via /actuator/beans), so an empty ZIPKIN_ENDPOINT used to
    # build a reporter aimed at an empty URI that dropped every span without a word. Tracing is
    # therefore opt-in: ZIPKIN_ENABLED=true + ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans.
    enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      # A4: 让 /actuator/health/readiness 在 compose/k8s 下都存在（非 k8s 环境 Boot 默认不建 probe 组）。
      probes:
        enabled: true
tinystore:
  internal:
    call-token: ${TINYSTORE_INTERNAL_CALL_TOKEN:changeit}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore_test?currentSchema=tinystore_account

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db:5432/tinystore?currentSchema=tinystore_account
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
