spring:
  application:
    name: promotion-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_promotion
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    locations: classpath:db/migration/promotion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: promotion-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  data:
    redis:
      host: localhost
      port: 6379

tinystore:
  security:
    permit-all:
      enabled: ${TINYSTORE_SECURITY_PERMIT_ALL_ENABLED:false}
  kafka:
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
      dlt:
        enabled: true
        suffix: .DLT

promotion:
  checkout:
    quote-ttl-minutes: 15
  coupon:
    lock-timeout-minutes: 15
    receive:
      user-limit-per-minute: 10
  budget:
    warning-threshold: 0.9
  reconciliation:
    interval-minutes: 5
    hot-coupon-interval-minutes: 1
    hot-coupons: []
  kafka:
    topic:
      order-events: tinystore.order.general
      ack-events: tinystore.promotion.general
  idempotency:
    ttl-seconds: 600
server:
  port: 1200

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    # D1: Boot 3.5 has no per-backend zipkin switch -- the sender and span handler are gated on
    # management.tracing.enabled (checked via /actuator/beans), so an empty ZIPKIN_ENDPOINT used to
    # build a reporter aimed at an empty URI that dropped every span without a word. Tracing is
    # therefore opt-in: ZIPKIN_ENABLED=true + ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans.
    enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      # A4: 让 /actuator/health/readiness 在 compose/k8s 下都存在（非 k8s 环境 Boot 默认不建 probe 组）。
      probes:
        enabled: true
