spring:
  application:
    name: promotion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/tinystore
    username: tinystore
    password: tinystore
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    locations: classpath:db/migration/promotion
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379

promotion:
  coupon:
    lock-timeout-minutes: 30
    receive:
      user-limit-per-minute: 10
  budget:
    warning-threshold: 0.9
  reconciliation:
    interval-minutes: 5
    hot-coupon-interval-minutes: 1
    hot-coupons: []
