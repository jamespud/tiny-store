spring:
  application:
    name: promotion-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tinystore?currentSchema=tinystore_promotion
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    locations: classpath:db/migration/promotion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: promotion-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  data:
    redis:
      host: localhost
      port: 6379

tinystore:
  security:
    permit-all:
      enabled: ${TINYSTORE_SECURITY_PERMIT_ALL_ENABLED:false}
  kafka:
    consumer:
      retry:
        max-attempts: 5
        backoff:
          initial-ms: 500
          multiplier: 2.0
          max-ms: 10000
      dlt:
        enabled: true
        suffix: .DLT

promotion:
  checkout:
    quote-ttl-minutes: 15
  coupon:
    lock-timeout-minutes: 15
    receive:
      user-limit-per-minute: 10
  budget:
    warning-threshold: 0.9
  reconciliation:
    interval-minutes: 5
    hot-coupon-interval-minutes: 1
    hot-coupons: []
  kafka:
    topic:
      order-events: tinystore.order.general
      ack-events: tinystore.promotion.general
server:
  port: 1200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always